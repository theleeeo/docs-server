{{define "partials/header"}}
<header>
    {{ if .HeaderImage }}
    <a href="{{ .PathPrefix }}/">
        <img src="{{ .HeaderImage }}" alt="header image">
    </a>
    {{ end }}
    {{ if .HasTitle }}
    <a href="{{ .PathPrefix }}/">
        <h1>{{ .HeaderTitle }}</h1>
    </a>
    {{ end }}
</header>
{{end}}
